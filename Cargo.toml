[workspace]
members = ["vox", "crates/*", "clients/*"]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0.103"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
yansi = "1.0.1"
regex = "1.12.4"
serde = { version = "1.0.228", features = ["derive"] }
fs-err = "3.3.0"
toml = "1.1.2"
rayon = "1.12.0"
dirs = "6.0.0"
tokio = { version = "^1", features = [
    "rt",
    "rt-multi-thread",
    "net",
    "macros",
] }
hickory-proto = "0.26.1"
hickory-resolver = { version = "0.26.1", features = ["tokio", "https-ring", "rustls-platform-verifier", "dnssec-ring"] }
rand = "0.10.1"
futures = "0.3.32"
hickory-client = "0.25.2"

vox_shared = { path = "crates/vox_shared", version = "0.1.0" }

[profile.release]
debug = true
debug-assertions = false
overflow-checks = false
lto = "thin"
codegen-units = 16
incremental = false
panic = "abort"

[profile.max-perf]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
